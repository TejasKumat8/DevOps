apiVersion: apps/v1
kind: Deployment
metadata:
  name: academic-marks-api
  labels:
    app: academic-marks-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: academic-marks-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: academic-marks-api
    spec:
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER   # replaced with the published sha-<commit> tag by cd.yml
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: marks-api-key
                  key: API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
